<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            margin: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        section {
            height: 100vh;
            width: 100%;
            position: relative;

            scroll-snap-align: start;
            scroll-snap-stop: always; 

            display: flex;
            flex-direction: column;
        }

        #landing {
            background-color: #DC0A2D;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .pokeball-svg {
            width: 200px;
            height: 200px;
            animation: bounce 3s infinite ease-in-out;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            animation: float 2s infinite;
            opacity: 0.8;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        #app-interface {
            background-color: #f8f9fa;
            justify-content: flex-start;
            align-items: center;
        }

        .menu-sticky-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #f8f9fa;
            width: 100%;

            padding: 60px 20px 20px 20px; 
            
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .menu-bar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 20px;
        }

        .menu-group {
            display: flex;
            gap: 15px;
        }

        .menu-btn {
            padding: 10px 25px;
            border: 2px solid #DC0A2D;
            background: white;
            color: #DC0A2D;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .menu-btn:hover, .menu-btn.active {
            background-color: #DC0A2D;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(220, 10, 45, 0.3);
        }

        .menu-group.auth .menu-btn {
            border-color: #333;
            color: #333;
        }
        .menu-group.auth .menu-btn:hover, .menu-group.auth .menu-btn.active {
            background-color: #333;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .content-wrapper {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px;
            flex-grow: 1; 
            overflow-y: auto; 
        }

        .content-display {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #moves, #signin, #signup {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.05);
        }

        .content-display.visible {
            display: block;
            opacity: 1;
            animation: slideUp 0.4s ease-out;
        }

        .content-header {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 25px;
            font-weight: 800;
            border-bottom: 4px solid #DC0A2D;
            display: inline-block;
        }

        .poke-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            justify-items: center;
        }

        .poke-tile {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .poke-tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(220, 10, 45, 0.15);
            border-color: #DC0A2D;
        }

        .tile-content {
            position: relative;
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poke-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
            opacity: 1;
        }

        .poke-name {
            position: absolute;
            font-size: 1.2rem;
            font-weight: 800;
            color: #DC0A2D;
            text-transform: uppercase;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .poke-tile:hover .poke-img { opacity: 0; }
        .poke-tile:hover .poke-name { opacity: 1; transform: scale(1); }

        .poke-index {
            font-size: 0.9rem;
            color: #ccc;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group input { 
            width: 100%; padding: 15px; 
            border: 2px solid #eee; border-radius: 8px; 
            outline: none; transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #DC0A2D; }
        
        .submit-btn {
            background: #DC0A2D; color: white; border: none;
            padding: 15px; border-radius: 8px; cursor: pointer;
            width: 100%; font-weight: 700; text-transform: uppercase;
        }

        .types-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .type-btn {
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            color: white;
            font-family: inherit;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
            opacity: 0.7;
        }

        .type-btn:hover {
            transform: translateY(-2px);
            opacity: 1;
        }

        .type-btn.active {
            opacity: 1;
            transform: scale(1.1);
            box-shadow: 0 0 0 4px rgba(0,0,0,0.1);
        }

        .type-fire { background-color: #EE8130; }
        .type-water { background-color: #6390F0; }
        .type-grass { background-color: #7AC74C; }
        .type-electric { background-color: #F7D02C; color: #333;}
        .type-psychic { background-color: #F95587; }
        .type-rock { background-color: #B6A136; }

        .moves-list {
            animation: fadeIn 0.3s ease;
        }

        .move-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #fff;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        
        .move-item:hover {
            background: #fafafa;
            border-color: #ddd;
        }

        .move-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #333;
        }

        .move-type-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            color: white;
            text-transform: uppercase;
            font-weight: 700;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- SECTION 1: STARTING PAGE -->
    <section id="landing">
        <svg class="pokeball-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M 5,50 A 45,45 0 0,0 95,50 Z" fill="white" stroke="#222" stroke-width="3" />
            <path d="M 5,50 A 45,45 0 0,1 95,50 Z" fill="#222" />
            <path d="M 5,50 A 45,45 0 0,1 95,50 Z" fill="#DC0A2D" stroke="#222" stroke-width="3" transform="scale(1)"/>
            <rect x="5" y="47" width="90" height="6" fill="#222" />
            <circle cx="50" cy="50" r="12" fill="white" stroke="#222" stroke-width="3"/>
            <circle cx="50" cy="50" r="7" fill="white" stroke="#ccc" stroke-width="1"/>
            <circle cx="50" cy="50" r="5" fill="white" />
        </svg>
    </section>

    <section id="app-interface">
        
        <!-- MENU  -->
        <div class="menu-sticky-wrapper">
            <div class="menu-bar">
                
                <div class="menu-group">
                    <button class="menu-btn" data-target="pokemons">Pokemons</button>
                    <button class="menu-btn" data-target="moves">Moves</button>
                </div>

                <div class="menu-group auth">
                    <button class="menu-btn" data-target="signin">Sign In</button>
                    <button class="menu-btn" data-target="signup">Sign Up</button>
                </div>

            </div>
        </div>

        <div class="content-wrapper">
            
            <!-- 1. POKEMONS -->
            <div id="pokemons" class="content-display">
                
                <div class="poke-grid">
                    
                    <div class="poke-tile">
                        <div class="tile-content">
                            <img src="https://archives.bulbagarden.net/media/upload/thumb/f/fb/0001Bulbasaur.png/500px-0001Bulbasaur.png" alt="Bulbasaur" class="poke-img">
                            <span class="poke-name">Bulbasaur</span>
                        </div>
                        <span class="poke-index">#001</span>
                    </div>

                    <div class="poke-tile">
                        <div class="tile-content">
                            <img src="https://archives.bulbagarden.net/media/upload/thumb/2/27/0004Charmander.png/500px-0004Charmander.png" alt="Charmander" class="poke-img">
                            <span class="poke-name">Charmander</span>
                        </div>
                        <span class="poke-index">#004</span>
                    </div>

                    <div class="poke-tile">
                        <div class="tile-content">
                            <img src="https://archives.bulbagarden.net/media/upload/thumb/5/54/0007Squirtle.png/500px-0007Squirtle.png" alt="Squirtle" class="poke-img">
                            <span class="poke-name">Squirtle</span>
                        </div>
                        <span class="poke-index">#007</span>
                    </div>

                </div>
            </div>

            <!-- 2. MOVES -->
            <div id="moves" class="content-display">
                <h2 class="content-header" style="text-align: center; border: none; display: block;">Select Move Type</h2>
                
                <!-- TYPES -->
                <div class="types-grid">
                    <button class="type-btn type-fire" onclick="filterMoves('fire')">Fire</button>
                    <button class="type-btn type-water" onclick="filterMoves('water')">Water</button>
                    <button class="type-btn type-grass" onclick="filterMoves('grass')">Grass</button>
                    <button class="type-btn type-electric" onclick="filterMoves('electric')">Electric</button>
                    <button class="type-btn type-psychic" onclick="filterMoves('psychic')">Psychic</button>
                    <button class="type-btn type-rock" onclick="filterMoves('rock')">Rock</button>
                </div>

                <div id="moves-list-container" class="moves-list">
                    <p style="text-align: center; color: #999; margin-top: 30px;">
                        Click a type above to see moves.
                    </p>
                </div>
            </div>

            <!-- 3. SIGN IN -->
            <div id="signin" class="content-display" style="max-width: 500px; margin: 0 auto;">
                <h2 class="content-header">Log In</h2>
                <form>
                    <div class="form-group">
                        <input type="email" placeholder="Email">
                    </div>
                    <div class="form-group">
                        <input type="password" placeholder="Password">
                    </div>
                    <button class="submit-btn">Login</button>
                </form>
            </div>

            <!-- 4. SIGN UP -->
            <div id="signup" class="content-display" style="max-width: 500px; margin: 0 auto;">
                <h2 class="content-header">Create Account</h2>
                <form>
                    <div class="form-group">
                        <input type="text" placeholder="Trainer Name">
                    </div>
                    <div class="form-group">
                        <input type="email" placeholder="Email">
                    </div>
                    <div class="form-group">
                        <input type="password" placeholder="Password">
                    </div>
                    <button class="submit-btn">Register</button>
                </form>
            </div>

        </div>
    </section>

    <script>
        const buttons = document.querySelectorAll('.menu-btn');
        const contents = document.querySelectorAll('.content-display');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                
                buttons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                contents.forEach(content => {
                    content.classList.remove('visible');
                    setTimeout(() => {
                        if(!content.classList.contains('visible')) {
                            content.style.display = 'none';
                        }
                    }, 400);
                });

                const targetId = button.getAttribute('data-target');
                const targetContent = document.getElementById(targetId);

                if (targetContent) {
                    targetContent.style.display = 'block';
                    setTimeout(() => {
                        targetContent.classList.add('visible');
                    }, 10);
                }
            });
        });

        const allMoves = [
            { name: "Flamethrower", type: "fire" },
            { name: "Ember", type: "fire" },
            { name: "Fire Blast", type: "fire" },
            { name: "Heat Wave", type: "fire" },
            
            { name: "Water Gun", type: "water" },
            { name: "Hydro Pump", type: "water" },
            { name: "Surf", type: "water" },
            { name: "Bubble Beam", type: "water" },

            { name: "Vine Whip", type: "grass" },
            { name: "Razor Leaf", type: "grass" },
            { name: "Solar Beam", type: "grass" },

            { name: "Thunderbolt", type: "electric" },
            { name: "Thunder Shock", type: "electric" },
            { name: "Volt Tackle", type: "electric" },

            { name: "Psychic", type: "psychic" },
            { name: "Confusion", type: "psychic" },
            { name: "Psybeam", type: "psychic" },

            { name: "Rock Throw", type: "rock" },
            { name: "Rock Slide", type: "rock" },
            { name: "Ancient Power", type: "rock" }
        ];

        function filterMoves(selectedType) {
            
            const typeBtns = document.querySelectorAll('.type-btn');
            typeBtns.forEach(btn => {
                btn.classList.remove('active'); // Remove from all
                if(btn.classList.contains('type-' + selectedType)) {
                    btn.classList.add('active'); // Add to the clicked one
                }
            });

            const filteredMoves = allMoves.filter(move => move.type === selectedType);
            
            const listContainer = document.getElementById('moves-list-container');
            
            listContainer.innerHTML = ''; 

            if(filteredMoves.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center">No moves found for this type.</p>';
                return;
            }

            filteredMoves.forEach(move => {

                
                const itemHTML = `
                    <div class="move-item">
                        <span class="move-name">${move.name}</span>
                        <span class="move-type-badge type-${move.type}">${move.type}</span>
                    </div>
                `;
                
                listContainer.innerHTML += itemHTML;
            });
        }
    </script>
</body>
</html>
