services:
  app:
    build: .
    container_name: pokedex_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    networks:
      - pokedex_net
    depends_on:
      - db

  db:
    image: postgres:18.0
    container_name: pokedex_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: pokedex
    volumes:
      - ./data/db:/var/lib/postgresql
      - ./scripts:/docker-entrypoint-initdb.d/
    networks:
      - pokedex_net

networks:
  pokedex_net:
    driver: bridge
